name: Hourly Live M3U Update

on:
  schedule:
    - cron: '0 * * * *'  # Runs exactly at minute 0 of every hour
  workflow_dispatch:     # Allows you to click a button to run it manually

permissions:
  contents: write        # Essential to avoid the 403 push permission error

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Generate M3U Playlist
        run: python update_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_news.m3u
          # Only commit if the file actually changed to avoid unnecessary commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "Hourly playlist auto-update" && git push)
