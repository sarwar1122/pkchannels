# ============================================================
# Automated IPTV Playlist Updater
# Runs every hour, commits updated playlist back to the repo
# ============================================================

name: Update IPTV Playlist

on:
  schedule:
    # POSIX cron – every hour at :05 past the hour (UTC)
    # The 5-minute offset avoids GitHub's peak-load window at :00
    - cron: "5 * * * *"

  # Allow triggering the workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable verbose logging (true/false)"
        required: false
        default: "false"

# Prevent parallel runs from creating conflicting commits
concurrency:
  group: playlist-update
  cancel-in-progress: false   # let the in-flight run finish

jobs:
  generate-playlist:
    name: Generate Live News Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 30        # hard cap – yt-dlp can hang occasionally

    permissions:
      contents: write          # required to push the updated playlist

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is not needed; shallow clone is faster
          fetch-depth: 1
          # Use the built-in GITHUB_TOKEN for authenticated push
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python environment ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip downloads to speed up subsequent runs
          cache: "pip"

      # ── 3. System dependencies ─────────────────────────────────────────
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          # ffmpeg is required by yt-dlp to mux certain HLS streams
          sudo apt-get install -y --no-install-recommends ffmpeg

      # ── 4. Python dependencies ─────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Always use the latest yt-dlp to avoid YouTube signature breakage
          pip install --upgrade yt-dlp

      # ── 5. Verify toolchain ────────────────────────────────────────────
      - name: Verify installed tool versions
        run: |
          python --version
          yt-dlp --version
          ffmpeg -version | head -1

      # ── 6. DNS reliability check ───────────────────────────────────────
      # GitHub Actions runners occasionally have transient DNS failures.
      # This step confirms connectivity before running the expensive script.
      - name: Check network connectivity
        run: |
          echo "Testing DNS resolution..."
          python - <<'EOF'
          import socket, sys, time

          targets = [
              ("www.youtube.com", 443),
              ("www.google.com",  443),
          ]
          all_ok = True
          for host, port in targets:
              for attempt in range(3):
                  try:
                      socket.setdefaulttimeout(10)
                      socket.getaddrinfo(host, port)
                      print(f"  ✓ {host}:{port} reachable")
                      break
                  except socket.gaierror as exc:
                      print(f"  ✗ {host}:{port} attempt {attempt+1}/3 failed: {exc}")
                      if attempt < 2:
                          time.sleep(5)
              else:
                  all_ok = False

          if not all_ok:
              print("DNS check failed – aborting run")
              sys.exit(1)
          print("Network OK")
          EOF

      # ── 7. Run playlist generator ──────────────────────────────────────
      - name: Generate playlist
        id: generate
        env:
          # Expose debug flag to the Python script via env if needed
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          # Suppress Python output buffering so logs appear in real time
          PYTHONUNBUFFERED: "1"
        run: |
          # Exit code 0 = streams found, 1 = no streams (non-fatal), 2 = fatal
          python generate_playlist.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # Allow exit code 1 (no streams) without failing the step
        continue-on-error: true

      # ── 8. Show generation results ─────────────────────────────────────
      - name: Show playlist status
        run: |
          echo "──────────────────────────────────────"
          echo "Playlist file contents (first 40 lines):"
          head -40 live_news.m3u || echo "(file not found)"
          echo ""
          echo "Status JSON:"
          cat playlist_status.json 2>/dev/null || echo "(status file not found)"
          echo "──────────────────────────────────────"

      # ── 9. Commit and push ─────────────────────────────────────────────
      - name: Commit and push updated playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Actions Bot"

          # Stage all generated output files
          git add live_news.m3u playlist_status.json playlist_generator.log

          # Only commit when there are real changes to avoid empty commits
          if git diff --cached --quiet; then
            echo "No changes detected – skipping commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            STREAM_COUNT=$(python -c "
          import json, pathlib
          try:
              d = json.loads(pathlib.Path('playlist_status.json').read_text())
              print(d.get('live_streams', 0))
          except Exception:
              print('?')
          ")
            git commit -m "chore: update playlist – ${STREAM_COUNT} live stream(s) [${TIMESTAMP}]"

            # Retry push up to 3 times to handle transient network failures
            for attempt in 1 2 3; do
              echo "Push attempt ${attempt}/3..."
              git push && break || {
                echo "Push failed – waiting 10 s before retry"
                sleep 10
                git pull --rebase   # incorporate any changes made since checkout
              }
            done
          fi

      # ── 10. Upload log as artifact ─────────────────────────────────────
      - name: Upload generation log
        if: always()           # upload even when earlier steps fail
        uses: actions/upload-artifact@v4
        with:
          name: playlist-generation-log-${{ github.run_id }}
          path: playlist_generator.log
          retention-days: 7    # keep logs for one week

      # ── 11. Notify on total failure ────────────────────────────────────
      - name: Mark workflow failed on fatal error
        if: steps.generate.outputs.exit_code == '2'
        run: |
          echo "::error::Playlist generator encountered a fatal error (exit code 2)"
          exit 1
